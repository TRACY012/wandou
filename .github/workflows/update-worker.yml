name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动检查更新
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查并更新 Worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }
          log "开始检查更新..."
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          log "本地版本: ${LOCAL_VERSION:-无}"
          
          log "获取最新 Release 信息..."
          RESPONSE=$(curl -s --retry 3 -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases")
          if [ $? -ne 0 ]; then
            log "ERROR: 无法访问 GitHub API"
            exit 1
          fi

          TAG_NAME=$(echo "$RESPONSE" | jq -r '.[0].tag_name')
          
          # 兼容匹配 worker.zip 或 unobfuscated-worker.zip
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.[0].assets[] | select(.name == "worker.zip" or .name == "unobfuscated-worker.zip" or .name == "worker.js") | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            log "尝试从备用链接获取最新压缩包..."
            DOWNLOAD_URL="https://github.com/bia-pain-bache/BPB-Worker-Panel/releases/download/$TAG_NAME/unobfuscated-worker.zip"
          fi

          log "最新版本: $TAG_NAME"
          log "下载地址: $DOWNLOAD_URL"

          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            log "已是最新版本，无需更新。"
            exit 0
          fi

          log "开始下载更新包..."
          curl -L -o downloaded_file.zip "$DOWNLOAD_URL" || curl -L -o downloaded_file.zip "https://github.com/bia-pain-bache/BPB-Worker-Panel/releases/download/$TAG_NAME/worker.zip"

          log "解压并更新本地文件..."
          unzip -o downloaded_file.zip || true
          rm -f downloaded_file.zip

          echo "$TAG_NAME" > version.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            log "文件无变化，跳过提交。"
          else
            git commit -m "Auto Update Worker to $TAG_NAME"
            git push
            log "更新成功，已提交更改！"
          fi
